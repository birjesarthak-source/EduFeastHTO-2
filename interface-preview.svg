<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
  <title id="title">EduFest interface preview</title>
  <desc id="description">A static visual preview of the refreshed EduFest admin dashboard, with dark sidebar navigation, statistic cards, and upcoming events and exams.</desc>
  <defs>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b32"/>
      <stop offset="1" stop-color="#14213c"/>
