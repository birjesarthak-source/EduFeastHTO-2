      .nav-active { fill: #fff; font-size: 13px; font-weight: 700; }
      .tiny { font-size: 10px; font-weight: 800; letter-spacing: 1.3px; }
      .card { fill: #fff; stroke: #e5eaf2; stroke-width: 1; }
      .line { stroke: #edf0f5; stroke-width: 1; }
    </style>
  </defs>

