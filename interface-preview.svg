      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#192b4d" flood-opacity=".055"/>
    </filter>
    <style>
