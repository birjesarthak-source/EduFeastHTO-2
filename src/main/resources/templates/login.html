```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduFest Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 430px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            color: #3949ab;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .login-as {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .admin {
            background: #3949ab;
            color: white;
        }

        .faculty {
            background: #00897b;
            color: white;
        }

        .student {
            background: #fb8c00;
            color: white;
        }

        #loginForm {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        #loginTitle {
            color: #3949ab;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3949ab;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .login-submit:hover {
            background: #303f9f;
        }

        .back-btn {
            margin-top: 12px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #3949ab;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">🎓 EduFest</div>

    <p class="subtitle">
        College Event &amp; Exam Management
    </p>

    <!-- Login feedback -->
    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <!-- Role selection -->
    <div id="roleSelection">

        <div class="login-as">Login As</div>

        <button type="button"
                class="login-btn admin"
                onclick="showLogin('Admin')">
            🔐 Admin Login
        </button>

        <button type="button"
                class="login-btn faculty"
                onclick="showLogin('Faculty / Volunteer')">
            👨‍🏫 Faculty / Volunteer Login
        </button>

        <button type="button"
                class="login-btn student"
                onclick="showLogin('Student')">
            🎓 Student Login
        </button>

    </div>

    <!-- Login form -->
    <div id="loginForm">

        <h4 id="loginTitle">Login</h4>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <input
                    type="email"
                    id="username"
                    name="email"
                    class="form-control"
                    placeholder="Enter Email"
                    autocomplete="username"
                    required>
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="login-submit">
                Login
            </button>

        </form>

        <button type="button"
                class="back-btn"
                onclick="goBack()">
            ← Back to Login Options
        </button>

    </div>

    <div class="footer">
        EduFest Management System
    </div>

</div>

<script>
    let selectedRole = "";

    function showLogin(role) {
        selectedRole = role;

        document.getElementById("roleSelection").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("loginTitle").innerText = role + " Login";

        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("username").focus();
    }

    function goBack() {
        document.getElementById("roleSelection").style.display = "block";
        document.getElementById("loginForm").style.display = "none";

        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    // Show the appropriate form again after a failed login.
    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        showLogin("Admin");
    }
</script>

</body>
</html>
```
