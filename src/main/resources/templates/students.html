<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Students')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="content">
<div class="topbar"><div><h1>Students</h1><p class="muted">Database-driven student and class information.</p></div></div>
<div class="panel mb-4"><div class="panel-head"><h5>Add Student</h5></div><form method="post" action="/students" class="row g-3 p-3">
<div class="col-md-2"><label>USN</label><input name="usn" class="form-control" required></div><div class="col-md-3"><label>Name</label><input name="name" class="form-control" required></div><div class="col-md-1"><label>Sem</label><input name="semester" type="number" class="form-control" required></div><div class="col-md-2"><label>Section</label><input name="section" class="form-control" required></div>
<div class="col-md-2"><label>Department</label><select name="department" class="form-select" required><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.departmentCode}"></option></select></div>
<div class="col-md-2"><label>Class</label><select name="classSection" class="form-select" required><option th:each="c:${sections}" th:value="${c.id}" th:text="${c.displayName}"></option></select></div><div class="col-12"><button class="btn btn-primary">Add Student</button></div></form></div>
<div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>USN</th><th>Name</th><th>Department</th><th>Semester</th><th>Section</th><th>Class</th></tr></thead><tbody><tr th:each="s:${students}"><td th:text="${s.usn}"></td><td th:text="${s.name}"></td><td th:text="${s.department.departmentCode}"></td><td th:text="${s.semester}"></td><td th:text="${s.section}"></td><td th:text="${s.classSection.displayName}"></td></tr></tbody></table></div></div>
</main></body></html>
