
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Seating Plan - EduFest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        :root {
            --navy: #172b4d;
            --blue: #3949ab;
            --light-blue: #eef2ff;
            --border: #dbe2ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f4f6fb;
            color: var(--navy);
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1600px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: clamp(25px, 3vw, 38px);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #71819b;
            margin: 0;
        }

        .panel {
            background: white;
            border-radius: 17px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 24px rgba(30, 45, 75, 0.06);
        }

        .control-grid {
            display: grid;
            grid-template-columns: minmax(220px, 1.4fr) minmax(220px, 1fr);
            gap: 25px;
            align-items: center;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #61738f;
            margin-bottom: 9px;
        }

        .form-select {
            padding: 13px;
            border: 1px solid #cbd5e5;
            border-radius: 10px;
            font-weight: 600;
        }

        .faculty-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f0f4ff;
            padding: 19px;
            border-radius: 12px;
            min-height: 95px;
        }

        .faculty-label {
            font-size: 12px;
            font-weight: 800;
            color: #71819b;
            letter-spacing: 1px;
        }

        .faculty-name {
            font-size: 19px;
            font-weight: 800;
            margin-top: 5px;
        }

        .room-stats {
            color: #71819b;
            margin-top: 12px;
            font-size: 14px;
        }

        .board-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 27px;
        }

        .board {
            width: min(450px, 90%);
            text-align: center;
            padding: 12px;
            background: #eaf0ff;
            border-radius: 8px;
            color: var(--blue);
            font-weight: 800;
            letter-spacing: 2px;
            border-bottom: 4px solid #a8b9ef;
        }

        .seating-grid {
            display: grid;
            grid-template-columns: repeat(var(--columns, 4), minmax(0, 1fr));
            gap: 14px;
        }

        .bench {
            min-width: 0;
            min-height: 80px;
            padding: 13px 8px;
            background: linear-gradient(135deg, #f6f8ff, #e9edff);
            border: 1px solid #9cafe7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .bench-content {
            width: 100%;
        }

        .bench-number {
            color: #7b8ca8;
            font-size: 11px;
            margin-bottom: 7px;
        }

        .bench-usn {
            color: #172b4d;
            font-size: clamp(10px, 1.1vw, 14px);
            font-weight: 800;
        }

        .empty-seat {
            background: #fafbfe;
            border: 1px dashed #d7deeb;
            color: #a0aabe;
        }

        .empty-message {
            padding: 50px 20px;
            text-align: center;
            color: #71819b;
        }

        .footer-note {
            color: #71819b;
            font-size: 14px;
            padding: 8px 2px;
        }

        .alert {
            border-radius: 10px;
        }

        @media (max-width: 850px) {
            body {
                padding: 14px;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }

            .seating-grid {
                gap: 8px;
            }

            .bench {
                min-height: 66px;
                padding: 8px 4px;
            }

            .panel {
                padding: 17px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .seating-grid {
                gap: 5px;
            }

            .bench {
                min-height: 60px;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                padding: 0;
                background: white;
            }

            .no-print {
                display: none !important;
            }

            .page {
                max-width: none;
            }

            .panel {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 12px;
                margin-bottom: 10px;
                break-inside: avoid;
            }

            .seating-grid {
                gap: 6px;
            }

            .bench {
                min-height: 54px;
                padding: 5px 3px;
                break-inside: avoid;
                background: white;
                border: 1px solid #888;
            }

            .bench-usn {
                font-size: 10px;
            }

            .board {
                background: white;
                border: 1px solid #888;
                color: black;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="page-header">
        <div>
            <h1>Exam Seating Plan</h1>
            <p class="subtitle">
                Exam ID: <span th:text="${exam.id}">1</span>
            </p>
        </div>

        <div class="d-flex gap-2 no-print">
            <a href="/exams" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>

            <button type="button"
                    class="btn btn-outline-primary"
                    onclick="window.print()">
                <i class="bi bi-printer"></i> Print Room
            </button>
        </div>
    </header>

    <!-- FEEDBACK -->
    <div th:if="${success}" class="alert alert-success no-print"
         th:text="${success}"></div>

    <div th:if="${error}" class="alert alert-warning no-print"
         th:text="${error}"></div>

    <!-- ROOM SELECTOR AND FACULTY -->
    <section class="panel">
        <div class="control-grid">

            <div>
                <label for="roomSelector" class="field-label">
                    Select Classroom
                </label>

                <select id="roomSelector" class="form-select">
                    <option value="">Choose a classroom</option>
                </select>

                <div class="room-stats" id="roomStats">
                    Select a room to see its seating plan.
                </div>
            </div>

            <div class="faculty-card">
                <div>
                    <div class="faculty-label">ALLOCATED INVIGILATOR</div>
                    <div class="faculty-name" id="facultyName">
                        Not assigned
                    </div>
                </div>

                <i class="bi bi-person-workspace fs-1"
                   style="color: #3949ab"></i>
            </div>

        </div>
    </section>

    <!-- SEATING PLAN -->
    <section class="panel">

        <div class="board-wrap">
            <div class="board">
                <i class="bi bi-easel"></i>
                FRONT / BOARD
            </div>
        </div>

        <div id="seatingGrid" class="seating-grid"
             style="--columns: 4">
        </div>

        <div id="emptyMessage" class="empty-message">
            <i class="bi bi-building fs-1 d-block mb-3"></i>
            Select a classroom to display the allocated USNs.
        </div>

    </section>

    <div class="footer-note">
        <i class="bi bi-info-circle"></i>
        Showing seating for the selected classroom only.
        Empty benches are not assigned to students.
    </div>

    <!-- DATA FROM SERVER -->
    <div id="allocationData" hidden>

        <div th:each="a : ${allocations}"
             class="allocation-row"
             th:attr="data-room-id=${a.room.id},
                      data-room-number=${a.room.roomNumber},
                      data-building=${a.room.building},
                      data-capacity=${a.room.capacity},
                      data-seat=${a.seatNumber},
                      data-usn=${a.student.usn}">

            <span class="data-faculty"
                  th:if="${roomFaculty != null and roomFaculty[a.room.id] != null}"
                  th:text="${roomFaculty[a.room.id].facultyName}">
            </span>

        </div>

    </div>

</div>

<script>
    const dataRows = Array.from(
        document.querySelectorAll(".allocation-row")
    );

    const roomSelector = document.getElementById("roomSelector");
    const seatingGrid = document.getElementById("seatingGrid");
    const emptyMessage = document.getElementById("emptyMessage");
    const facultyName = document.getElementById("facultyName");
    const roomStats = document.getElementById("roomStats");

    const rooms = new Map();

    // Group allocations by classroom.
    dataRows.forEach(row => {
        const id = row.dataset.roomId;

        if (!rooms.has(id)) {
            rooms.set(id, {
                id: id,
                number: row.dataset.roomNumber,
                building: row.dataset.building || "",
                capacity: Number(row.dataset.capacity || 0),
                allocations: [],
                faculty: "Not assigned"
            });
        }

        const room = rooms.get(id);

        const faculty = row.querySelector(".data-faculty");

        if (faculty && faculty.textContent.trim()) {
            room.faculty = faculty.textContent.trim();
        }

        room.allocations.push({
            usn: row.dataset.usn || "",
            seat: Number(row.dataset.seat || 0)
        });
    });

    // Sort classroom options by room number.
    Array.from(rooms.values())
        .sort((a, b) => a.number.localeCompare(b.number,
            undefined, { numeric: true }))
        .forEach(room => {
            const option = document.createElement("option");

            option.value = room.id;
            option.textContent = "Room " + room.number +
                (room.building ? " — " + room.building : "");

            roomSelector.appendChild(option);
        });

    function showRoom(roomId) {
        seatingGrid.replaceChildren();

        if (!roomId || !rooms.has(roomId)) {
            emptyMessage.style.display = "block";
            facultyName.textContent = "Not assigned";
            roomStats.textContent = "Select a room to see its seating plan.";
            return;
        }

        const room = rooms.get(roomId);

        // Sort seats in their assigned seat-number order.
        const students = [...room.allocations].sort(
            (a, b) => a.seat - b.seat
        );

        const count = students.length;

        if (count === 0) {
            emptyMessage.style.display = "block";
            return;
        }

        emptyMessage.style.display = "none";

        // Use four columns by default, with more rows than columns.
        // For smaller classes, reduce the number of columns if needed.
let columns = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(count))));
        // Ensure the grid is taller than it is wide.
        while (Math.ceil(count / columns) <= columns && columns > 1) {
            columns--;
        }

        const rows = Math.ceil(count / columns);

        seatingGrid.style.setProperty("--columns", columns);

        facultyName.textContent = room.faculty;

        roomStats.textContent =
            rows + " Rows • " + columns + " Columns • " +
            count + " Assigned Seats" +
            (room.capacity ? " • Capacity " + room.capacity : "");

        // Render seats row by row, from the front to the back.
        students.forEach((student, index) => {
            const rowNumber = Math.floor(index / columns) + 1;
            const columnNumber = (index % columns) + 1;

            const bench = document.createElement("div");
            bench.className = "bench";

            const content = document.createElement("div");
            content.className = "bench-content";

            const number = document.createElement("div");
            number.className = "bench-number";
            number.textContent =
                "Row " + rowNumber + " • Seat " + student.seat;

            const usn = document.createElement("div");
            usn.className = "bench-usn";
            usn.textContent = student.usn;

            content.appendChild(number);
            content.appendChild(usn);
            bench.appendChild(content);
            seatingGrid.appendChild(bench);
        });
    }

    roomSelector.addEventListener("change", function () {
        showRoom(this.value);
    });

    // Automatically display the first allocated classroom.
    if (roomSelector.options.length > 1) {
        roomSelector.selectedIndex = 1;
        showRoom(roomSelector.value);
    }
</script>

</body>
</html>
