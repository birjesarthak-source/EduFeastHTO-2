
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Room Allocation - EduFest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <a href="/events" class="btn btn-outline-secondary mb-4">
        &larr; Back to Events
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 th:text="${event.eventName}">Event Name</h2>

            <div class="row mt-4 g-3">
                <div class="col-md-4">
                    <strong>Date</strong>
                    <p th:text="${event.eventDate}"></p>
                </div>
                <div class="col-md-4">
                    <strong>Start Time</strong>
                    <p th:text="${event.startTime}"></p>
                </div>
                <div class="col-md-4">
                    <strong>End Time</strong>
                    <p th:text="${event.endTime}"></p>
                </div>
                <div class="col-md-4">
                    <strong>Duration</strong>
                    <p>
                        <span th:text="${durationMinutes}"></span> minutes
                    </p>
                </div>
                <div class="col-md-4">
                    <strong>Participants</strong>
                    <p th:text="${event.expectedParticipants}"></p>
                </div>
            </div>

            <hr>

            <h4 class="mb-3">Allocated Classrooms</h4>

            <div th:if="${#lists.isEmpty(allocations)}"
                 class="alert alert-warning">
                No rooms have been allocated to this event yet.
            </div>

            <div th:unless="${#lists.isEmpty(allocations)}"
                 class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                    <tr>
                        <th>Room</th>
                        <th>Building</th>
                        <th>Capacity</th>
                        <th>Allocated Participants</th>
                        <th>Booking Time</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${allocations}">
                        <td th:text="${a.room.roomNumber}"></td>
                        <td th:text="${a.room.building}"></td>
                        <td th:text="${a.room.capacity}"></td>
                        <td th:text="${a.allocatedCapacity}"></td>
                        <td>
                            <span th:text="${event.startTime}"></span>
                            -
                            <span th:text="${event.endTime}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
