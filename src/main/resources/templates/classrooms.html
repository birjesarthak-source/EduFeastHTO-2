<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Classrooms')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="content">
<div class="topbar"><div><h1>Classrooms</h1><p class="muted">Manage capacity and availability.</p></div></div>
<div class="panel mb-4"><div class="panel-head"><h5>Add Classroom</h5></div><form method="post" action="/classrooms" class="row g-3 p-3">
<div class="col-md-2"><label>Room</label><input name="roomNumber" class="form-control" required></div><div class="col-md-3"><label>Building</label><input name="building" class="form-control" required></div><div class="col-md-1"><label>Floor</label><input name="floor" type="number" class="form-control" value="1" required></div><div class="col-md-2"><label>Capacity</label><input name="capacity" type="number" class="form-control" required></div><div class="col-md-2"><label>Type</label><select name="roomType" class="form-select"><option th:each="t:${types}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-2"><label>Status</label><select name="availabilityStatus" class="form-select"><option>AVAILABLE</option><option>MAINTENANCE</option><option>OUT_OF_SERVICE</option></select></div><div class="col-12"><button class="btn btn-primary">Add Classroom</button></div></form></div>
<div class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Room</th><th>Building</th><th>Floor</th><th>Capacity</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="r:${classrooms}"><td><b th:text="${r.roomNumber}"></b></td><td th:text="${r.building}"></td><td th:text="${r.floor}"></td><td th:text="${r.capacity}"></td><td th:text="${r.roomType}"></td><td><span class="badge-soft" th:text="${r.availabilityStatus}"></span></td><td><a class="btn btn-sm btn-outline-danger" th:href="@{'/classrooms/delete/'+${r.id}}" onclick="return confirm('Delete this classroom?')"><i class="bi bi-trash"></i></a></td></tr></tbody></table></div></div>
</main></body></html>
